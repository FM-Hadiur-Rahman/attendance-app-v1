name: Build and Submit iOS + Android Production

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-submit:
    name: EAS Build and Submit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint || true

      - name: Type Check
        run: npx tsc --noEmit --skipLibCheck || true

      - name: Build iOS
        run: eas build --platform ios --profile production --non-interactive --wait

      - name: Submit iOS
        run: eas submit --platform ios --profile production --latest --non-interactive

      - name: Build Android
        run: eas build --platform android --profile production --non-interactive --wait

      - name: Submit Android
        run: eas submit --platform android --profile production --latest --non-interactive
